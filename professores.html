<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Gestão Acadêmica - Professores</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img src="img\logo.png" alt="Logo IFC" class="logo" />
      <h1>Gestão Acadêmica</h1>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="cursos.html">Cadastro de Cursos</a></li>
        <li><a href="professores.html">Cadastro de Professores</a></li>
      </ul>
    </nav>

    <main>
      <div class="header-tabela">
        <h2>Professores Cadastrados</h2>
        <button id="btn-abrir-modal" class="btn-primario">
          Adicionar Professor
        </button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo"></tbody>
      </table>
    </main>

    <div id="modal-container" class="modal">
      <div class="modal-conteudo">
        <span id="btn-fechar" class="fechar">&times;</span>
        <h2>Novo Professor</h2>
        <form id="form-professor">
          <label>Nome do Professor:</label>
          <input type="text" id="nome" required />

          <label>E-mail:</label>
          <input type="email" id="email" required />

          <button type="submit" class="btn-primario mt">Salvar Cadastro</button>
        </form>
      </div>
    </div>

    <script src="professores.js"></script>
  </body>
</html>
